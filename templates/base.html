<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropertyMaps RMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            width: 280px !important;
            min-height: 100vh;
            background-color: #1e293b !important;
            color: #fff;
            transition: all 0.3s;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 0.8rem 1.5rem;
            margin-bottom: 0.2rem;
            border-radius: 0.5rem;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .sidebar .navbar-brand {
            color: #fff;
            font-weight: 700;
            padding: 1.5rem;
            display: block;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .main-content {
            padding: 2rem;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Mobile Header -->
    <nav class="navbar navbar-dark d-md-none px-3 py-2 shadow-sm" style="background: #1e293b;">
        <a href="{% url 'dashboard' %}" class="navbar-brand text-decoration-none m-0 font-weight-bold">
            <i class="bi bi-buildings-fill me-2"></i>PropRMS
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="d-flex flex-column flex-md-row min-vh-100">
        <!-- Sidebar -->
        <div class="sidebar offcanvas-md offcanvas-start flex-shrink-0" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
            <div class="offcanvas-header border-bottom d-md-none" style="border-color: rgba(255,255,255,0.1) !important;">
                <h5 class="offcanvas-title text-white" id="sidebarMenuLabel">
                    <i class="bi bi-buildings-fill me-2"></i>PropRMS
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
            </div>
            
            <a href="{% url 'dashboard' %}" class="navbar-brand text-decoration-none d-none d-md-block">
                <i class="bi bi-buildings-fill me-2"></i>PropRMS
            </a>
            
            <div class="offcanvas-body d-flex flex-column pt-3">
                <ul class="nav flex-column px-3 w-100">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'property_list' %}active{% endif %}" href="{% url 'property_list' %}">
                            <i class="bi bi-houses me-2"></i> Properties
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'tenant_list' %}active{% endif %}" href="{% url 'tenant_list' %}">
                            <i class="bi bi-people me-2"></i> Tenants
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'lease_list' %}active{% endif %}" href="{% url 'lease_list' %}">
                            <i class="bi bi-file-earmark-text me-2"></i> Leases
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'records' in request.path %}active{% endif %}" href="{% url 'financial_list' %}">
                            <i class="bi bi-wallet2 me-2"></i> Financial Records
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if 'ledger' in request.path %}active{% endif %}" href="{% url 'ledger' %}">
                            <i class="bi bi-journal-text me-2"></i> Rent Ledger
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <hr class="dropdown-divider bg-light">
                    </li>
                    <li class="nav-item pb-3">
                        <form method="post" action="{% url 'logout' %}" class="px-3 py-2">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-outline-light w-100">
                                <i class="bi bi-box-arrow-right me-2"></i> Sign out
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-grow-1 px-3 px-md-4 py-4 w-100 d-flex flex-column" style="min-width: 0;">
            <div class="flex-grow-1">
                {% block content %}{% endblock %}
            </div>
            <footer class="mt-auto py-3 text-center text-muted small border-top">
                &copy; {% now "Y" %} PropertyMaps RMS. All rights reserved.
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.9"></script>
</body>
</html>
